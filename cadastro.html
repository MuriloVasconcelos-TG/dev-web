<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - cadastro</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topo">
    <h1>🎮 Game Store</h1>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="index.html">Jogos</a>
        <a href="cadastro.html">Cadastrar</a>
    </nav>
</header>

<main class="area-cadastro">
    <form action="formCadastro">
        <h2>Crie sua conta</h2>
        <p>Faça sua parte da comunidade Game Store!</p>
        <br><br>
        <label for="nome">Nome Completo</label>
        <br><br>
        <input type="text" id="nome" placeholder="Digite seu nome..." required>
        <br><br>
        <label for="email">Email:</label>
        <br><br>
        <input type="email" id="Digite seu email" placeholder="seu@email.com">
        <br><br>
        <label for="senha">Senha:</label>
        <br><br>
        <input type="password" id="senha" placeholder=" Crie uma senha" minlength="6"><br><br>

        <label for="plataforma">Sua plataforma favorita</label>
        <select name="plataforma" id="plataforma" required>
            <option value="">Selecione</option>
            <option value="PC">PC</option>
            <option value="Playstation">Playstation</option>
            <option value="Xbox">Xbox</option>
            <option value="Nintendo">Nintendo</option>
        </select><br><br>
        <button type="submit" class="botao"> cadastrar</button>
            
            <pi id="mensagem" aria-live="polite"></p>
            <a href="index.html" class="voltar">
                voltar a página inicial
            </a>
    </form>
</main>
<footer>
    <p>&copy; 2026 Game Store - Todos os direitos reservados.</p>
</footer>


</body>
</html>
