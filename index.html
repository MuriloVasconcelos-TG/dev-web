<form action="#" method="post">

<label for="nome">Nome</label>
<br><br>
<input type="text" name="" id="nome" placeholder="Seu nome completo">
<br><br>
<label for="Email">e-mail:</label>
<br><br>
<input type="email" id="email" placeholder="seuemail@email.com">
<br><br>
<label for="senha">senha (min 6, só letras e números):</label>
<br><br>
<input type="password" id="senha" pattern="[a-zA=Z0-9]{6,}" placeholder="Minimo 6 caractéres.." required>
<br><br>
<input type="number" name="" id="idade" min="13" max="99" required>

</form>
